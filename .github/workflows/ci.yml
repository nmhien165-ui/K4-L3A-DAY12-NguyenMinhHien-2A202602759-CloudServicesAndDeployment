name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run checkpoint tests
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: fake://
        run: >-
          python -m pytest tests/ -v
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag day12-agent:ci .

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout repository
        if: env.RAILWAY_TOKEN != ''
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: env.RAILWAY_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: npm install --global @railway/cli

      - name: Deploy verified commit
        if: env.RAILWAY_TOKEN != ''
        run: >-
          railway up
          --project "${{ vars.RAILWAY_PROJECT_ID }}"
          --service "${{ vars.RAILWAY_SERVICE_ID }}"
          --environment "${{ vars.RAILWAY_ENVIRONMENT_ID }}"
          --ci

      - name: Smoke test
        if: env.RAILWAY_TOKEN != ''
        run: |
          sleep 45
          curl --fail --show-error --silent --retry 10 --retry-delay 6 \
            "${{ vars.PUBLIC_URL }}/health"
